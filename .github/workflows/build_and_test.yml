name: Build & light tests (GitHub runners)

on:
  workflow_dispatch:
  push:

jobs:
  build_and_test:
    name: OTP ${{matrix.otp}} - ${{matrix.test_target}}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp: ['27.3', '28.3', '29.0']
        # 3.24 was built with OTP 25, which the OTP 29 beam loader rejects;
        # 3.27 is built with OTP 26 and loads on every OTP in the matrix.
        rebar3: ['3.27']
        test_target: ['compile', 'eunit', 'acceptor-test', 'otp-compat-test', 'security-test']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OTP and rebar3
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          rebar3-version: ${{matrix.rebar3}}

      - name: Start epmd
        run: epmd -daemon

      - name: Compile
        if: matrix.test_target == 'compile'
        run: rebar3 compile

      - name: Eunit
        if: matrix.test_target == 'eunit'
        run: rebar3 as test eunit

      # Covers the vendored acceptor_pool (src/acceptor*.erl). Single node,
      # no TLS, no disterl; ~10s.
      - name: Acceptor Pool Tests
        if: matrix.test_target == 'acceptor-test'
        run: make acceptor-test

      - name: OTP Compatibility Tests
        if: matrix.test_target == 'otp-compat-test'
        run: make otp-compat-test

      # Single CT case, no cluster — it fits a GitHub runner, unlike the
      # multi-node suites offloaded to Fly in fly-test.yml.
      - name: Security Tests
        if: matrix.test_target == 'security-test'
        run: make security-test
