name: Fly heavy test suite

# Offloads the resource-heavy multi-node CT suite to a large ephemeral Fly.io
# machine (GitHub runners OOM-kill it). Light suites stay in build_and_test.yml.
#
# Requires two repo secrets:
#   FLY_API_TOKEN  — a deploy token:  fly tokens create deploy -a partisan-ci
#   FLY_ORG        — your Fly organisation slug (fly orgs list)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Makefile target (ci-heavy | core-test | alt-test | proper)"
        default: "ci-heavy"
  push:
    branches: [master]
  schedule:
    - cron: "0 3 * * 1"   # weekly, Monday 03:00 UTC

jobs:
  fly:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: partisan-ci
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Run suite on a large Fly machine
        run: |
          set -euo pipefail
          TARGET="${{ github.event.inputs.target || 'ci-heavy' }}"

          flyctl apps list | grep -qw "$APP" \
            || flyctl apps create "$APP" --org "${{ secrets.FLY_ORG }}"

          # `fly deploy` (not `machine run`) is required — it initialises the
          # app registry and builds with the repo as context (root fly.toml).
          flyctl deploy --remote-only --ha=false --env "TEST_TARGET=$TARGET"

          # deploy returns once the machine STARTS; poll for its exit code so
          # this job gates on the actual test result.
          ID=$(flyctl machine list --app "$APP" --json | jq -r '.[0].id')
          echo "machine=$ID"
          flyctl logs --app "$APP" --machine "$ID" &
          LOGS=$!
          CODE=""
          for _ in $(seq 1 480); do        # up to ~2h
            sleep 15
            STATE=$(flyctl machine status "$ID" --app "$APP" --json | jq -r '.state')
            if [ "$STATE" = "stopped" ]; then
              # NOTE: verify the exit-code JSON path for your flyctl version.
              CODE=$(flyctl machine status "$ID" --app "$APP" --json | jq -r '.exit_code // empty')
              break
            fi
          done

          kill "$LOGS" 2>/dev/null || true
          flyctl machine destroy "$ID" --app "$APP" --force || true
          echo "exit_code=${CODE:-<timeout>}"
          test "${CODE:-1}" = "0"
