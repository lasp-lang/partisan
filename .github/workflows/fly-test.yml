name: Fly heavy test suite

# Offloads the resource-heavy multi-node CT suite to a large ephemeral Fly.io
# machine (GitHub runners OOM-kill it). Light suites stay in build_and_test.yml.
#
# Requires two repo secrets:
#   FLY_API_TOKEN  — a deploy token:  fly tokens create deploy -a partisan-ci
#   FLY_ORG        — your Fly organisation slug (fly orgs list)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Makefile target (ci-heavy | core-test | alt-test | proper)"
        default: "ci-heavy"
  push:
    branches: [master]
  schedule:
    - cron: "0 3 * * 1"   # weekly, Monday 03:00 UTC

jobs:
  fly:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Serialised deliberately. The step below destroys EVERY machine on the
      # app before deploying, which is app-global: two matrix legs running at
      # once would delete each other's running machine mid-suite. One app, one
      # machine, one leg at a time.
      max-parallel: 1
      matrix:
        # Same majors as build_and_test.yml. The heavy multi-node suites ran
        # only on the image default before this, so a version-specific fault in
        # them was invisible.
        otp: ['27.3', '28.3', '29.0']
    name: fly ${{ github.event.inputs.target || 'ci-heavy' }} - OTP ${{ matrix.otp }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: partisan-ci
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Run suite on a large Fly machine
        run: |
          set -euo pipefail
          TARGET="${{ github.event.inputs.target || 'ci-heavy' }}"

          flyctl apps list | grep -qw "$APP" \
            || flyctl apps create "$APP" --org "${{ secrets.FLY_ORG }}"

          # Destroy any machine left behind by a cancelled or timed-out run.
          # Load-bearing: our machine is a one-shot runner
          # (`[[restart]] policy = "never"`), so it ends every run in `stopped'.
          # `flyctl deploy` against an existing STOPPED machine performs a
          # rolling CONFIG UPDATE and leaves it stopped — it exits 0 having run
          # nothing, so the job would report success without testing anything.
          # Only machine CREATION starts a machine, so we must delete first.
          for m in $(flyctl machines list --app "$APP" -q 2>/dev/null || true); do
            echo "destroying stale machine $m"
            flyctl machine destroy -f "$m" --app "$APP" || true
          done

          # `fly deploy` (not `machine run`) is required — it initialises the
          # app registry and builds with the repo as context (root fly.toml).
          # --build-arg selects the erlang base image; the Dockerfile declares
          # OTP_VERSION before FROM. The OTP test sources the compat suites read
          # are fetched per running major by partisan_otp_test_gen, so nothing
          # needs pre-seeding for a version this app has not built before.
          flyctl deploy --remote-only --ha=false \
            --env "TEST_TARGET=$TARGET" \
            --build-arg "OTP_VERSION=${{ matrix.otp }}"

          # deploy returns once the machine STARTS; poll for its exit code so
          # this job gates on the actual test result.
          #
          # NOTE: `flyctl machine status` has NO --json flag (checked against
          # flyctl v0.4.71) — passing it errors with "unknown flag: --json",
          # which under `set -e` kills this step. State AND exit_code are both
          # available from `machines list --json`, so use only that.
          ID=$(flyctl machines list --app "$APP" --json | jq -r '.[0].id')
          echo "machine=$ID"
          flyctl logs --app "$APP" --machine "$ID" &
          LOGS=$!

          state_of() {
            flyctl machines list --app "$APP" --json \
              | jq -r --arg id "$ID" '.[] | select(.id==$id) | .state'
          }

          # Wait for it to actually enter `started' before watching for `stopped',
          # so we cannot mistake the pre-start moment for a finished run.
          for _ in $(seq 1 60); do
            [ "$(state_of)" = "started" ] && break
            sleep 5
          done

          CODE=""
          for _ in $(seq 1 480); do        # up to ~2h
            sleep 15
            if [ "$(state_of)" = "stopped" ]; then
              CODE=$(flyctl machines list --app "$APP" --json \
                | jq -r --arg id "$ID" '.[] | select(.id==$id) | .exit_code // empty')
              break
            fi
          done

          kill "$LOGS" 2>/dev/null || true
          flyctl machine destroy "$ID" --app "$APP" --force || true
          echo "exit_code=${CODE:-<timeout>}"
          test "${CODE:-1}" = "0"
